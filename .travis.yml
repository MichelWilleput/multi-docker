sudo: required
services:
  - docker
before_install:
  - docker build -f ./client/Dockerfile.dev -t michelwilleput/multi-test ./client
script:
  - docker run -e CI=true michelwilleput/multi-test npm run test

after_success:
  - docker build -t michelwilleput/multi-client ./client
  - docker build -t michelwilleput/multi-nginx ./nginx
  - docker build -t michelwilleput/multi-server ./server
  - docker build -t michelwilleput/multi-worker ./worker
  # Log in to the docker CLI
  - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_ID" --password--stdin
  # Take those images and push then to docker hub
  - docker push michelwilleput/multi-client
  - docker push michelwilleput/multi-nginx
  - docker push michelwilleput/multi-server
  - docker push michelwilleput/multi-worker